<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Arcish</title>
    <link rel="stylesheet" href="../palette/palette.css" />
  </head>
  <body data-host="mini">
    <div class="backdrop"></div>
    <div class="bar">
      <div class="input-row">
        <span class="lead" id="lead"></span>
        <input id="q" autocomplete="off" spellcheck="false" autofocus data-i18n-placeholder="miniPlaceholder" />
      </div>
      <div class="results" id="results"></div>
      <div class="footer">
        <span><b>↵</b> <span data-i18n="miniHintOpenHere"></span></span>
        <span><b>⌘↵</b> <span data-i18n="miniOpenInMain"></span></span>
      </div>
    </div>
    <script type="module" src="../palette/main.js"></script>
  </body>
</html>
