name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Check, test and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Static checks (syntax, imports, locales, manifest)
        run: npm run check
      - name: Unit and UI tests
        run: npm test
      - name: Build the package
        run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: arcish
          path: dist/*.zip
          if-no-files-found: error

  browser:
    name: Smoke test in Chrome
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Load the extension into Chrome and exercise it
        run: npm run smoke
        env:
          CHROME_BIN: google-chrome
          # GitHub's runners do not allow Chrome's sandbox to start.
          SMOKE_CHROME_FLAGS: --no-sandbox
